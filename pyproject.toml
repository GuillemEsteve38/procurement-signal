[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-signal"
version = "0.1.0"
description = "Ingest and enrich EU public procurement notices (TED) for a target market profile"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
extract = ["anthropic>=0.69"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "jinja2>=3.1"]

[project.scripts]
procsignal-ingest = "procsignal.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
